name: nightly-retry

# Re-run only the failed jobs of a failed nightly-capture run, at most twice more (attempts 1 and 2
# trigger a rerun; attempt 3 is final). Uses only the built-in GITHUB_TOKEN. No secrets, no pushes.
#
# NOTE: workflow_run (like schedule) events fire only from the workflow file on the DEFAULT branch.
# This file must exist on the default branch for retries to trigger; so does nightly-capture.yml's cron.
# A manual workflow_dispatch run of nightly-capture on another branch is also retried only if this
# file is on the default branch (workflow_run uses the default-branch definition).
on:
  workflow_run:
    workflows: [nightly-capture]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait, then re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          echo "nightly-capture run $RUN_ID attempt $ATTEMPT failed; re-running failed jobs after 60s"
          sleep 60
          gh run rerun "$RUN_ID" --failed -R "$REPO"
